<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>WWBC Display (Build: Aug 08, 07:58 PM UTC)</title>

    <!-- Decorative fonts for the light (Founders Day) welcome style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Dancing+Script:wght@700&family=Great+Vibes&family=Kaushan+Script&family=Lobster&family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&family=Playfair+Display:wght@700;900&display=swap">

    <link rel="stylesheet" href="css/slides.css?v=20261026a">
    <link rel="stylesheet" href="css/display.css?v=20261026a">
</head>

<body class="display-page">

<!-- Welcome Screen -->
<section id="welcomeScreen">

    <!-- The editable Welcome Screen design for the current occasion
         (made on the Announcements page → Welcome Screens tab). -->
    <div id="welcomeDesign" hidden>
        <div id="welcomeDesignStage"></div>
        <div id="welcomeDesignCountdown" class="slide-countdown welcome-countdown" hidden></div>
    </div>



    <div id="welcomeContent">

        <h1>Whosoever Will Baptist Church</h1>

        <h2>Welcome</h2>

        <h3>Sunday Worship Service</h3>

        <div id="welcomeTheme" class="welcome-theme" style="display:none;">
            <div id="welcomeThemeMain"></div>
            <div id="welcomeThemeSub"></div>
        </div>

        <div id="welcomeDate"></div>

        <div id="countdownArea">

            <div id="countdownLabel" class="countdown-slot-hidden">
                Service begins in
            </div>

            <div id="countdown" class="countdown-slot-hidden">
                --:--
            </div>

        </div>

    </div>

</section>


    <!-- Scripture Screen -->
    <section id="scriptureScreen">

        <div id="header">
            <div id="referenceText"></div>
        </div>

        <div id="scriptureContainer">
            <div id="verseText"></div>
        </div>

    </section>


    <!-- Hymnal Screen -->
    <section id="hymnalScreen">

        <div id="hymnalHeader">
            <div id="hymnalTitleText"></div>
        </div>

        <div id="hymnalContainer">
            <div id="hymnalWordsText"></div>
        </div>

    </section>


    <!-- Announcement slides (made on the Announcements page) -->
    <section id="announcementScreen">
        <div id="announcementStage"></div>
        <div id="announcementCountdown" class="slide-countdown" hidden></div>
    </section>


    <div id="fullscreenPrompt" class="fullscreen-prompt" style="display:none;">
        <button id="enterFullscreenButton" type="button" class="fullscreen-prompt-button">
            🖥️ Tap to Enter Fullscreen
        </button>
    </div>

    <script src="js/slides.js?v=20261026a"></script>
    <script src="js/display.js?v=20261026a"></script>

</body>
</html>
