<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WWBC Hymnal Control</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hymnal.css">
</head>

<body>

<div class="container">

    <div class="content">

        <h1>WWBC Hymnal Control</h1>

        <input
            type="number"
            id="hymnNumber"
            placeholder="Example: 23"
            autocomplete="off"
            inputmode="numeric"
            min="1"
        >

        <div style="text-align:center;">
            <button id="lookupHymnButton" type="button">
                🔎 Look Up
            </button>
        </div>

        <!-- Shown when the hymn number isn't in the library yet -->
        <div id="newHymnPanel" class="new-hymn-panel" style="display:none;">

            <div class="new-hymn-label">
                This hymn isn't saved yet — type it in once, and it'll be ready every time after.
            </div>

            <input
                type="text"
                id="hymnTitle"
                placeholder="Hymn title"
                autocomplete="off"
            >

            <textarea
                id="hymnWords"
                placeholder="Type the hymn's words here, from your own physical hymnal. Use a blank line between verses/chorus."
                rows="10"
            ></textarea>

            <div style="text-align:center;">
                <button id="saveHymnButton" type="button">
                    💾 Save to Hymnal Library
                </button>
            </div>

        </div>

        <!-- Shown once a hymn is loaded (new or existing) -->
        <div id="hymnPreviewPanel" class="new-hymn-panel" style="display:none;">

            <div id="hymnPreviewTitle" class="hymn-preview-title"></div>
            <div id="hymnPreviewWords" class="hymn-preview-words"></div>

            <div class="display-controls">
                <button id="prepareHymnButton" type="button">
                    📖 Prepare
                </button>

                <button id="displayHymnButton" type="button">
                    ▶ Display
                </button>

                <button id="returnWelcomeHymnButton" type="button">
                    Welcome
                </button>

                <button id="editHymnButton" type="button">
                    ✏ Edit
                </button>
            </div>

        </div>

        <div id="hymnStatusPanel" class="status-panel">

            <div class="status-title">System Status</div>

            <div id="hymnStatusMessage">
                🟢 Ready
            </div>

            <div class="now-showing-label">
                Live Display
            </div>

            <div id="hymnCurrentDisplayText">
                Welcome Screen
            </div>

            <div class="now-showing-label">
                Prepared Hymn
            </div>

            <div id="preparedHymnText">
                None
            </div>

        </div>

    </div>

    <div class="bottom-actions">

        <button id="hymnHomeButton" onclick="location.href='index.html'">
            ⬅ Home
        </button>

    </div>

</div>

<script src="js/hymnal.js"></script>
</body>

</html>
